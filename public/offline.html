<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Taskeeper</title>
  <!-- Self-contained on purpose: the service worker caches this one file, so it must
       not depend on build-hashed assets that a later deploy removes. -->
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --strong: #0e121b; --sub: #525866; --primary: #4f39f6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e121b; --strong: #ffffff; --sub: #99a0ae; --primary: #7c86ff; } }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; background: var(--bg); color: var(--strong);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    p { margin: 0; max-width: 24rem; color: var(--sub); }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px;
      background: var(--primary); color: #ffffff; font-weight: 500; text-decoration: none; }
  </style>
</head>
<body>
  <h1>You’re offline</h1>
  <p>Taskeeper needs a connection. Check your network and try again.</p>
  <a href="/" onclick="location.reload(); return false;">Try again</a>
</body>
</html>
