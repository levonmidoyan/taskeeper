services:
  postgres:
    image: postgres:17-alpine
    container_name: taskeeper-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskeeper
      POSTGRES_PASSWORD: taskeeper
      POSTGRES_DB: taskeeper
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taskeeper-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskeeper -d taskeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Official MinIO images are no longer published on Docker Hub/quay (the
    # minio/minio repo returns 404, quay.io/minio/minio requires auth), so
    # this pins Bitnami's archived ("legacy") build instead. Any S3-compatible
    # server works here.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: taskeeper-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: taskeeper
      MINIO_ROOT_PASSWORD: taskeeper-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - taskeeper-minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskeeper-pgdata:
  taskeeper-minio:
