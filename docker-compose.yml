services:
  postgres:
    image: postgres:17-alpine
    container_name: taskeeper-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskeeper
      POSTGRES_PASSWORD: taskeeper
      POSTGRES_DB: taskeeper
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taskeeper-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskeeper -d taskeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pinned: MinIO stopped publishing new community images in late 2025, so
    # this is the last tag we rely on. Any S3-compatible server works here.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: taskeeper-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: taskeeper
      MINIO_ROOT_PASSWORD: taskeeper-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - taskeeper-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskeeper-pgdata:
  taskeeper-minio:
