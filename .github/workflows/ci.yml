name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env: &env
      TZ: UTC
      DATABASE_URL: postgres://taskeeper:taskeeper@localhost:5432/taskeeper_test
      DATABASE_URL_TEST: postgres://taskeeper:taskeeper@localhost:5432/taskeeper_test
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: taskeeper
      S3_SECRET_ACCESS_KEY: taskeeper-secret
      S3_BUCKET: taskeeper
      S3_BUCKET_TEST: taskeeper-test

    # Server tests need the database and storage too, not only e2e.
    services: &services
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskeeper
          POSTGRES_PASSWORD: taskeeper
          POSTGRES_DB: taskeeper_test
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskeeper"
          --health-interval 5s --health-timeout 5s --health-retries 10

      # Same image as docker-compose.yml (Bitnami's archived MinIO build).
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: taskeeper
          MINIO_ROOT_PASSWORD: taskeeper-secret
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit and server tests
        run: yarn test

  e2e:
    # Only PRs into master run e2e: v2 work collects on develop and reaches
    # master once, at go-live, where this run gates it. The push run after a
    # merge only repeats the checks job.
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    env: *env
    services: *services
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Browsers are keyed on yarn.lock, which pins the Playwright version.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # Headless runs only need the headless shell, not full Chromium. On a
      # cache hit the download is skipped and only the shell's system libraries
      # are installed; `install-deps chromium` would also pull in xvfb and X
      # fonts from a mirror that can crawl.
      - name: Install browsers
        run: yarn playwright install --with-deps --only-shell chromium

      # The e2e web server runs `next build`; its cache makes rebuilds incremental.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: End-to-end tests
        run: yarn e2e
