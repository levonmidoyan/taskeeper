name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      DATABASE_URL: postgres://taskeeper:taskeeper@localhost:5432/taskeeper_test
      DATABASE_URL_TEST: postgres://taskeeper:taskeeper@localhost:5432/taskeeper_test
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: taskeeper
      S3_SECRET_ACCESS_KEY: taskeeper-secret
      S3_BUCKET: taskeeper
      S3_BUCKET_TEST: taskeeper-test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskeeper
          POSTGRES_PASSWORD: taskeeper
          POSTGRES_DB: taskeeper_test
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskeeper"
          --health-interval 5s --health-timeout 5s --health-retries 10

      # Same image as docker-compose.yml (Bitnami's archived MinIO build).
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: taskeeper
          MINIO_ROOT_PASSWORD: taskeeper-secret
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 turns package-manager caching on by default as soon as
          # package.json has a "packageManager" field. It probes the cache with
          # the runner's global Yarn 1, which refuses to run in a yarn@4 project,
          # so the step failed before corepack could be enabled below.
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      # --immutable is the CI lockfile check: it fails rather than silently
      # updating yarn.lock.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Apply migrations
        run: yarn db:migrate

      - name: Create storage buckets
        run: yarn storage:init

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit and server tests
        run: yarn test

      - name: Install browsers
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn e2e
